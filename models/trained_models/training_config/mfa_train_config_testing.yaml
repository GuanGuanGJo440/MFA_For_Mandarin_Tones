beam: 10
retry_beam: 40

features:
  type: "mfcc"
  use_energy: false
  use_pitch: true
  uses_deltas: true
  uses_splices: true
  splice_left_context: 3
  splice_right_context: 3
  frame_length: 10
  frame_shift: 5

training:
  - monophone:
      subset: 0
      num_iterations: 40
      max_gaussians: 1000
      boost_silence: 1.25

  - triphone:
      subset: 0
      num_iterations: 35
      num_leaves: 2000
      max_gaussians: 10000
      cluster_threshold: -1
      boost_silence: 1.25
      power: 0.25

  - lda:
      subset: 0
      num_leaves: 2500
      max_gaussians: 15000
      num_iterations: 35

  - sat:
      subset: 0
      num_leaves: 2500
      max_gaussians: 15000
      power: 0.2
      silence_weight: 0.0
      fmllr_update_type: "full"

  - sat:
      subset: 0
      num_leaves: 4200
      max_gaussians: 40000
      power: 0.2
      silence_weight: 0.0
      fmllr_update_type: "full"

  - pronunciation_probabilities:
      subset: 0
      silence_probabilities: true

  - sat:
      subset: 0
      num_leaves: 5000
      max_gaussians: 100000
      power: 0.2
      silence_weight: 0.0
      fmllr_update_type: "full"

  - pronunciation_probabilities:
      subset: 0
      silence_probabilities: true
      optional: true # Skipped if the corpus is smaller than the subset

  - sat:
      subset: 0
      quick: true # Performs fewer fMLLR estimation
      num_iterations: 20
      num_leaves: 7000
      max_gaussians: 150000
      power: 0.2
      silence_weight: 0.0
      fmllr_update_type: "full"
      optional: true # Skipped if the corpus is smaller than the previous subset
